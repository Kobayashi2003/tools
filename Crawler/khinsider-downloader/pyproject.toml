[project]
name = "khinsider-downloader"
version = "0.1.0"
requires-python = ">=3.14"
dependencies = [
    "requests>=2.25.0",
    "selenium>=4.0.0",
    "webdriver-manager>=3.8.0",
]

[dependency-groups]
dev = [
    "basedpyright>=1.40.2",
    "ruff>=0.17.0",
]

[tool.uv]
package = false

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "W", "I", "B", "UP"]

[tool.basedpyright]
include = ["main.py"]
typeCheckingMode = "standard"
