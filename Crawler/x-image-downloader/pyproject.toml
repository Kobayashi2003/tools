[project]
name = "x-image-downloader"
version = "0.1.0"
requires-python = ">=3.14"
dependencies = [
    "beautifulsoup4>=4.12.0",
    "httpx>=0.24.0",
    "lxml>=4.9.0",
    "playwright>=1.40.0",
]

[dependency-groups]
dev = [
    "basedpyright>=1.40.2",
    "ruff>=0.17.0",
]

[tool.uv]
package = false

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "W", "I", "B", "UP"]

[tool.basedpyright]
include = ["main.py"]
typeCheckingMode = "standard"
