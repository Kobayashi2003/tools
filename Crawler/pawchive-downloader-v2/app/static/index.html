<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Pawchive v2</title>
  <link rel="icon" href="icon.svg?v=2" type="image/svg+xml">
  <link rel="stylesheet" href="css/tokens.css">
  <link rel="stylesheet" href="css/shell.css">
  <link rel="stylesheet" href="css/atoms.css">
  <link rel="stylesheet" href="css/creator.css">
  <link rel="stylesheet" href="css/views.css">
  <script>
    // Applied before first paint, so the page never flashes another theme, width or a
    // collapsed sidebar open.
    try {
      const root = document.documentElement;
      if (localStorage.getItem('side') === 'collapsed') root.classList.add('side-collapsed');
      const theme = localStorage.getItem('theme');
      if (theme === 'light' || theme === 'dark') root.dataset.theme = theme;
      const w = Number(localStorage.getItem('sideW'));
      if (w >= 240 && w <= 440) root.style.setProperty('--side-w', w + 'px');
    } catch { /* storage unavailable */ }
  </script>
</head>
<body>
  <div class="app">
    <aside class="side" aria-label="Sidebar">
      <div class="side-head">
        <div class="brand">
          <a class="brand-mark" href="#/" title="Overview"><img src="icon.svg?v=2" alt="" width="20" height="20"><span>Pawchive v2</span></a>
          <button type="button" class="icon-btn" id="side-toggle" aria-label="Collapse sidebar" title="Collapse sidebar (Ctrl+B)">
            <svg width="16" height="16" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5" aria-hidden="true"><rect x="2" y="3" width="12" height="10" rx="1.5"/><path d="M6 3v10"/></svg>
          </button>
        </div>
        <nav aria-label="Views">
          <a href="#/" data-nav="overview" title="Overview"><svg width="16" height="16" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5" aria-hidden="true"><rect x="2.5" y="2.5" width="4.5" height="5.5" rx="1"/><rect x="9" y="2.5" width="4.5" height="3.5" rx="1"/><rect x="9" y="8" width="4.5" height="5.5" rx="1"/><rect x="2.5" y="10" width="4.5" height="3.5" rx="1"/></svg><span>Overview</span></a>
          <a href="#/recent" data-nav="recent" title="Inbox: posts downloaded lately"><svg width="16" height="16" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5" aria-hidden="true"><path d="M2.5 9.5 4 3.5h8l1.5 6v3.5h-11z"/><path d="M2.5 9.5h3.2l.8 1.5h3l.8-1.5h3.2"/></svg><span>Inbox</span><b class="nav-n" id="recent-n" hidden></b></a>
          <a href="#/jobs" data-nav="jobs" title="Jobs"><svg width="16" height="16" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5" aria-hidden="true"><path d="M3 4h10M3 8h10M3 12h6"/></svg><span>Jobs</span><b class="nav-n live" id="jobs-n" hidden></b></a>
          <a href="#/links" data-nav="links" title="Links"><svg width="16" height="16" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5" aria-hidden="true"><path d="M6.5 9.5a3 3 0 0 0 4.2 0l2.1-2.1a3 3 0 0 0-4.2-4.2l-.8.8M9.5 6.5a3 3 0 0 0-4.2 0L3.2 8.6a3 3 0 0 0 4.2 4.2l.8-.8"/></svg><span>Links</span><b class="nav-n" id="links-n" hidden></b></a>
          <a href="#/settings" data-nav="settings" title="Settings"><svg width="16" height="16" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5" aria-hidden="true"><circle cx="8" cy="8" r="2"/><path d="M8 1.8v2M8 12.2v2M1.8 8h2M12.2 8h2M3.6 3.6l1.4 1.4M11 11l1.4 1.4M3.6 12.4 5 11M11 5l1.4-1.4"/></svg><span>Settings</span></a>
        </nav>
      </div>
      <div class="side-sec"><span>Creators</span><span class="num" id="creators-n"></span></div>
      <div class="side-actions">
        <label class="field" for="crsearch"><svg width="14" height="14" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.6" aria-hidden="true"><circle cx="7" cy="7" r="4.5"/><path d="m10.5 10.5 3 3"/></svg><input id="crsearch" placeholder="Search or paste a link" title="Type to filter; press Enter on a link to add it" autocomplete="off"></label>
        <a class="btn icon" href="#/add" title="Add creator" aria-label="Add creator"><svg width="14" height="14" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.6" aria-hidden="true"><path d="M8 3v10M3 8h10"/></svg></a>
        <button type="button" class="btn icon" id="tree-fold"></button>
      </div>
      <div class="tree" id="tree"></div>
      <div class="side-foot" id="side-foot"></div>
      <div class="side-resize" id="side-resize" title="Drag to resize; double-click to reset" aria-hidden="true"></div>
    </aside>
    <div class="main-wrap">
      <div class="progress" id="progress" hidden></div>
      <div class="banner" id="banner" hidden></div>
      <main class="main" id="main"></main>
    </div>
  </div>
  <script type="module" src="js/app.js"></script>
</body>
</html>
