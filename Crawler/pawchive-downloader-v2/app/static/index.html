<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Pawchive v2</title>
  <link rel="icon" href="icon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="style.css">
  <script>
    // Applied before first paint, so a collapsed sidebar never flashes open.
    try { if (localStorage.getItem('side') === 'collapsed') document.documentElement.classList.add('side-collapsed'); } catch { /* storage unavailable */ }
  </script>
</head>
<body>
  <div class="app">
    <aside class="side" aria-label="Sidebar">
      <div class="side-head">
        <div class="brand">
          <a class="brand-mark" href="#/" title="Overview"><img src="icon.svg" alt="" width="20" height="20"><span>Pawchive v2</span></a>
          <button type="button" class="icon-btn" id="side-toggle" aria-label="Collapse sidebar" title="Collapse sidebar">
            <svg width="16" height="16" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5" aria-hidden="true"><rect x="2" y="3" width="12" height="10" rx="1.5"/><path d="M6 3v10"/></svg>
          </button>
        </div>
        <nav aria-label="Views">
          <a href="#/" data-nav="creators" title="Creators"><svg width="16" height="16" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5" aria-hidden="true"><circle cx="8" cy="5.5" r="2.5"/><path d="M3 13.5c.6-2.4 2.6-3.7 5-3.7s4.4 1.3 5 3.7"/></svg><span>Creators</span></a>
          <a href="#/jobs" data-nav="jobs" title="Jobs"><svg width="16" height="16" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5" aria-hidden="true"><path d="M3 4h10M3 8h10M3 12h6"/></svg><span>Jobs</span></a>
          <a href="#/settings" data-nav="settings" title="Settings"><svg width="16" height="16" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5" aria-hidden="true"><circle cx="8" cy="8" r="2"/><path d="M8 1.8v2M8 12.2v2M1.8 8h2M12.2 8h2M3.6 3.6l1.4 1.4M11 11l1.4 1.4M3.6 12.4 5 11M11 5l1.4-1.4"/></svg><span>Settings</span></a>
        </nav>
        <div class="side-actions">
          <label class="field" for="crsearch"><svg width="14" height="14" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.6" aria-hidden="true"><circle cx="7" cy="7" r="4.5"/><path d="m10.5 10.5 3 3"/></svg><input id="crsearch" placeholder="Search or paste a link" title="Type to filter; press Enter on a link to add it" autocomplete="off"></label>
          <a class="btn icon" href="#/add" title="Add creator" aria-label="Add creator"><svg width="14" height="14" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.6" aria-hidden="true"><path d="M8 3v10M3 8h10"/></svg></a>
          <button type="button" class="btn icon" id="tree-fold"></button>
        </div>
      </div>
      <div class="tree" id="tree"></div>
      <div class="side-foot" id="side-foot"></div>
    </aside>
    <div class="main-wrap">
      <div class="progress" id="progress" hidden></div>
      <div class="banner" id="banner" hidden></div>
      <main class="main" id="main"></main>
    </div>
  </div>
  <script type="module" src="js/app.js"></script>
</body>
</html>
