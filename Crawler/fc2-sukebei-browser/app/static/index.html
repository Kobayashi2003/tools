<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="referrer" content="no-referrer">
  <title>FC2 Sukebei Browser</title>
  <link rel="icon" href="static/icon.svg?v=2" type="image/svg+xml">
  <link rel="stylesheet" href="static/style.css">
</head>
<body>
  <div class="app-chrome">
  <header class="topbar">
    <div class="brand">
      <img src="static/icon.svg?v=2" alt="" width="22" height="22">
      <span>FC2 <b>Sukebei</b></span>
    </div>

    <label class="library-search">
      <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="10.5" cy="10.5" r="6.5"/><path d="m16 16 4.5 4.5"/></svg>
      <input id="filter-q" type="search" data-i18n-placeholder="filterPlaceholder" data-i18n-label="filterLibrary" aria-label="Filter library">
      <kbd>/</kbd>
    </label>
    <div class="top-actions">
      <button id="job-update" class="btn primary" type="button" data-i18n-title="updateHint">
        <span aria-hidden="true">⟳</span><span data-i18n="update">Update</span>
      </button>
      <button id="job-cancel" class="btn" type="button" hidden data-i18n="cancel">Cancel</button>
      <button id="status-pill" class="status-pill" type="button" aria-expanded="false" aria-controls="status-panel">
        <span class="dot"></span><span id="status-text">…</span><span class="chevron" aria-hidden="true">⌄</span>
      </button>
      <button id="keys-open" class="btn ghost square" type="button" data-i18n-label="shortcuts" data-i18n-title="shortcuts">?</button>
      <button id="lang-toggle" class="btn ghost lang" type="button" title="Language / 言語">日本語</button>
    </div>
  </header>

  <section id="status-panel" class="status-panel" hidden aria-labelledby="sync-title">
    <div class="sync-title"><h2 id="sync-title" data-i18n="librarySync">Library sync</h2><button id="status-close" class="icon" type="button" data-i18n-label="close">×</button></div>
    <div class="status-head">
      <div id="status-stats" class="status-stats" aria-busy="true"></div>
      <button id="retry-failed" class="btn small" type="button" data-i18n="retryFailed">Retry failed</button>
    </div>
    <div id="ruler" class="ruler"></div>
    <dl id="coverage" class="coverage"></dl>

    <section class="sync-section">
    <h3 data-i18n="crawl">Crawl</h3>
    <div class="crawl">
      <select id="crawl-source" aria-label="Search source" data-i18n-title="sourceHint">
        <option value="nyaa">sukebei.nyaa.si</option>
        <option value="nyaa_cn">sukebei.cn.nyaa.net</option>
      </select>
        <button id="job-older" class="btn" type="button" data-i18n-title="olderHint">
          <span aria-hidden="true">↓</span> <span data-i18n="older">Older</span>
        </button>
      <button id="history-reset" class="btn small" type="button" data-i18n="historyReset" data-i18n-title="historyResetHint">Re-check history</button>
      <label class="check" data-i18n-title="checkFilesHint"><input id="crawl-files" type="checkbox"><span data-i18n="checkFiles">Check files</span></label>
    </div>
        <div id="older-options" class="older-options">
          <div class="opt-grid">
            <label for="older-blocks" data-i18n="olderBlocks">Blocks per run</label>
            <div class="opt-inline">
              <input id="older-blocks" type="number" min="1" max="99999" value="5">
              <label class="check"><input id="older-all" type="checkbox"><span data-i18n="olderAll">All that are left</span></label>
            </div>
            <label for="older-digits" data-i18n="olderSize">Block size</label>
            <div class="opt-inline">
              <select id="older-digits" aria-label="Block size">
                <option value="3" data-i18n="size3">10,000 ids</option>
                <option value="4" data-i18n="size4">1,000 ids</option>
                <option value="5" data-i18n="size5">100 ids</option>
              </select>
            </div>
          </div>
          <label class="check"><input id="older-stop-empty" type="checkbox"><span data-i18n="olderStopEmpty">Stop at the first block with no results</span></label>
          <label class="check"><input id="older-range-on" type="checkbox"><span data-i18n="olderRange">Read an id range instead</span></label>
          <div class="opt-inline opt-range" id="older-range-fields">
            <span class="dim">FC2</span>
            <input id="older-range-from" type="number" min="10000" placeholder="4802999" aria-label="From FC2 id">
            <span class="dim">→</span>
            <input id="older-range-to" type="number" min="10000" placeholder="4800000" aria-label="Down to FC2 id">
          </div>
          <p id="older-summary" class="opt-note"></p>
        </div>
    </section>
    <section class="sync-section">
      <h3><label for="search-query" data-i18n="customQuery">Custom sukebei query</label></h3>
      <form id="search-form" class="search" autocomplete="off">
        <input id="search-query" type="search" data-i18n-placeholder="searchPlaceholder" aria-label="Sukebei query">
        <button id="query-run" class="btn" type="submit" data-i18n="searchSukebei">Search sukebei</button>
      </form>
      <p class="opt-note" data-i18n="queryHint">Reads every page of this query into the library.</p>
    </section>
    <h3 class="log-heading" data-i18n="activity">Activity</h3>
    <ol id="status-log" class="status-log"></ol>
  </section>

  <nav class="toolbar">
    <div class="segmented" id="filter-view" role="tablist">
      <button type="button" data-view="all" class="active" data-i18n="viewAll">All</button>
      <button type="button" data-view="unseen" data-i18n="viewUnseen">Unseen</button>
      <button type="button" data-view="starred" data-i18n="viewStarred">Starred</button>
      <button type="button" data-view="hidden" data-i18n="viewHidden">Hidden</button>
    </div>
    <select id="filter-sort" aria-label="Sort">
      <option value="uploaded" data-i18n="sortUploaded">Recently uploaded</option>
      <option value="seeders" data-i18n="sortSeeders">Most seeders</option>
      <option value="released" data-i18n="sortReleased">Release date</option>
      <option value="rating" data-i18n="sortRating">Rating</option>
      <option value="size" data-i18n="sortSize">Largest</option>
      <option value="id" data-i18n="sortId">FC2 id</option>
      <option value="added" data-i18n="sortAdded">Recently added</option>
    </select>
    <label class="seed-filter" data-i18n-title="minSeedersHint">
      <span>▲</span><input id="filter-seeders" type="number" min="0" value="0" aria-label="Minimum seeders">
    </label>
    <label class="check">
      <input id="filter-media" type="checkbox">
      <span data-i18n="withPreviews">With previews</span>
    </label>
    <button id="filter-chip" class="filter-chip" type="button" hidden data-i18n-title="clearSearch"><span></span><span aria-hidden="true">×</span></button>
    <span id="result-count" class="result-count"></span>
    <label class="size-control" data-i18n-title="cardSize">
      <svg viewBox="0 0 24 24" aria-hidden="true"><rect x="4" y="4" width="7" height="7" rx="1"/><rect x="13" y="4" width="7" height="7" rx="1"/><rect x="4" y="13" width="7" height="7" rx="1"/><rect x="13" y="13" width="7" height="7" rx="1"/></svg>
      <input id="card-size" type="range" min="160" max="380" step="10" value="232" aria-label="Card size">
    </label>
  </nav>
  </div>

  <main>
    <div id="grid" class="grid"></div>
    <div id="empty" class="empty" hidden></div>
    <div id="library-end" class="library-end" hidden></div>
    <div id="sentinel" class="sentinel"></div>
  </main>

  <div id="detail" class="detail" hidden>
    <div class="detail-backdrop" data-close></div>
    <button class="nav prev" type="button" data-step="-1" aria-label="Previous">‹</button>
    <article class="detail-panel" role="dialog" aria-modal="true" aria-labelledby="detail-code" tabindex="-1"></article>
    <button class="nav next" type="button" data-step="1" aria-label="Next">›</button>
  </div>

  <div id="lightbox" class="lightbox" hidden role="dialog" aria-modal="true" data-i18n-label="sampleImages" tabindex="-1">
    <img alt="">
    <button class="lb-nav prev" type="button" data-step="-1" aria-label="Previous">‹</button>
    <button class="lb-nav next" type="button" data-step="1" aria-label="Next">›</button>
    <span class="lb-count"></span>
    <button class="lb-close" type="button" aria-label="Close">×</button>
  </div>

  <div id="marks-nav" class="marks-nav" hidden>
    <div id="mark-list" class="mark-list" hidden></div>
    <button id="mark-prev" class="btn" type="button" data-i18n-title="markPrev" aria-label="Previous mark">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="m15 6-6 6 6 6"/></svg>
    </button>
    <button id="mark-count" class="btn mark-count" type="button" aria-expanded="false" aria-haspopup="true">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M7 4h10v16l-5-3.6L7 20z"/></svg>
      <span class="mark-count-text"></span>
    </button>
    <button id="mark-next" class="btn" type="button" data-i18n-title="markNext" aria-label="Next mark">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="m9 6 6 6-6 6"/></svg>
    </button>
  </div>

  <div id="toast" class="toast" role="status" aria-live="polite"></div>

  <dialog id="keys-dialog" class="keys-dialog" aria-labelledby="keys-title">
    <div class="sync-title"><h2 id="keys-title" data-i18n="shortcuts">Keyboard shortcuts</h2><button id="keys-close" class="icon" type="button" data-i18n-label="close">×</button></div>
    <div id="keys-list"></div>
  </dialog>

  <script type="module" src="static/app.js"></script>
</body>
</html>
