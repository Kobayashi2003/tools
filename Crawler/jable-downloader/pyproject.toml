[project]
name = "jable-downloader"
version = "0.1.0"
requires-python = ">=3.14"
dependencies = [
    "beautifulsoup4>=4.12.3",
    "m3u8>=0.8.0",
    "pycryptodome>=3.17",
    "pyyaml>=6",
    "requests>=2.31.0",
    "selenium>=4.51.0",
    "tqdm>=4.66.5",
]

[dependency-groups]
dev = [
    "basedpyright>=1.40.2",
    "ruff>=0.17.0",
]

[tool.uv]
package = false

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "W", "I", "B", "UP"]

[tool.basedpyright]
include = ["main.py"]
typeCheckingMode = "standard"
