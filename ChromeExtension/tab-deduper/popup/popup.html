<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <link rel="stylesheet" href="popup.css">
</head>
<body>
  <div class="header">
    <div class="icon">
      <svg viewBox="0 0 20 20" fill="none" xmlns="http://www.w3.org/2000/svg">
        <rect x="2" y="4" width="12" height="8" rx="2" stroke="white" stroke-width="1.5"/>
        <rect x="6" y="7" width="12" height="8" rx="2" stroke="white" stroke-width="1.5" opacity="0.5"/>
        <line x1="14" y1="13" x2="18" y2="13" stroke="white" stroke-width="1.5" stroke-linecap="round"/>
        <line x1="16" y1="11" x2="16" y2="15" stroke="white" stroke-width="1.5" stroke-linecap="round"/>
      </svg>
    </div>
    <div>
      <div class="title">Tab Deduper</div>
      <div class="subtitle">Keep your tabs clean</div>
    </div>
  </div>

  <div class="body">
    <div class="stat-row">
      <div class="stat-card">
        <div class="stat-num" id="total">—</div>
        <div class="stat-label">Total tabs</div>
      </div>
      <div class="stat-card">
        <div class="stat-num accent" id="dupes">—</div>
        <div class="stat-label">Duplicates</div>
      </div>
    </div>

    <button id="btn">
      <svg viewBox="0 0 16 16" fill="none" xmlns="http://www.w3.org/2000/svg">
        <path d="M2 8a6 6 0 1 0 6-6" stroke="white" stroke-width="1.5" stroke-linecap="round"/>
        <polyline points="2,5 2,8 5,8" stroke="white" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
      </svg>
      Deduplicate tabs
    </button>

    <div id="msg" class="msg hidden"></div>
  </div>

  <script src="popup.js"></script>
</body>
</html>
